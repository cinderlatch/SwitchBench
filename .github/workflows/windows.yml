name: Windows build and test
on:
  push:
    branches: [main, windows-port]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: SwiftyLab/setup-swift@d60245579ea3836a3f2fa65ebbe1e8891d577c76 # v1.14.2
        with:
          swift-version: '6.3.3'
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-zlib
      - name: Build native helpers
        shell: msys2 {0}
        run: bash Windows/build-native.sh
      - name: Build worker and run shared engine tests
        shell: pwsh
        run: ./Windows/build.ps1 -Test
      - name: Test the portable package
        shell: pwsh
        run: ./Windows/package.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SwitchBench-Windows-x64
          path: build/windows/SwitchBench-Windows-x64.zip
          if-no-files-found: error
