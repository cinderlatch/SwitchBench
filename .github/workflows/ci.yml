name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    name: Apple Silicon build and synthetic regression
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Build app and helpers
        run: bash build.sh
      - name: Run synthetic tests
        run: bash test.sh
