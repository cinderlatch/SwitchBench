name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    name: macOS regression and Apple Silicon cross-build
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify native test architecture
        run: test "$(uname -m)" = x86_64
      - name: Build native Intel test helpers
        run: |
          make -C Vendor/hactool -j4
          make -C Vendor/hacPack -j4
      - name: Run full synthetic regression on Intel
        run: bash test.sh
      - name: Cross-build Apple Silicon app and helpers
        run: bash build.sh
      - name: Verify release architectures and signature
        run: |
          lipo build/SwitchBench.app/Contents/MacOS/SwitchBench -verify_arch arm64
          lipo build/SwitchBench.app/Contents/Helpers/hactool -verify_arch arm64
          lipo build/SwitchBench.app/Contents/Helpers/hacpack -verify_arch arm64
          codesign --verify --deep --strict build/SwitchBench.app
